    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdfa"/><stop offset="1" stop-color="#d8d0c6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#5b4633" flood-opacity="0.22"/></filter>
    <filter id="steam" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <ellipse cx="515" cy="555" rx="360" ry="58" fill="#654a34" opacity="0.14"/>
