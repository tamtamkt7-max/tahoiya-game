    <ellipse cx="405" cy="380" rx="47" ry="20" transform="rotate(8 405 380)"/><ellipse cx="480" cy="385" rx="48" ry="20" transform="rotate(-14 480 385)"/><ellipse cx="555" cy="370" rx="47" ry="19" transform="rotate(6 555 370)"/><ellipse cx="625" cy="395" rx="48" ry="20" transform="rotate(-6 625 395)"/>
