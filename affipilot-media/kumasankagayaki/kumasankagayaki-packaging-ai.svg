<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">米の包装イメージ</title>
  <desc id="desc">未開封の米を保存する包装を抽象的に表したイラスト</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f1e8"/><stop offset="1" stop-color="#eadfce"/></linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#e8ddc8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6f5a42" flood-opacity="0.20"/></filter>
    <pattern id="grain" width="38" height="26" patternUnits="userSpaceOnUse"><ellipse cx="12" cy="13" rx="7" ry="3.5" fill="#d8c6a8" opacity="0.48" transform="rotate(-18 12 13)"/><ellipse cx="30" cy="7" rx="6" ry="3" fill="#d8c6a8" opacity="0.34" transform="rotate(15 30 7)"/></pattern>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <ellipse cx="600" cy="510" rx="430" ry="52" fill="#79664f" opacity="0.12"/>
  <g filter="url(#shadow)">
    <g transform="translate(195 285) rotate(-3)">
      <rect x="0" y="0" width="810" height="150" rx="44" fill="url(#bag)" stroke="#d5c7b2" stroke-width="4"/>
      <rect x="36" y="26" width="738" height="98" rx="32" fill="url(#grain)"/>
      <path d="M22 31H788M22 119H788" stroke="#c8b89d" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    </g>
    <g transform="translate(230 205) rotate(1.5)">
      <rect x="0" y="0" width="740" height="145" rx="42" fill="url(#bag)" stroke="#d5c7b2" stroke-width="4"/>
      <rect x="34" y="24" width="672" height="96" rx="30" fill="url(#grain)"/>
      <path d="M20 30H720M20 115H720" stroke="#c8b89d" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    </g>
    <g transform="translate(275 125) rotate(-1)">
      <rect x="0" y="0" width="650" height="140" rx="40" fill="url(#bag)" stroke="#d5c7b2" stroke-width="4"/>
      <rect x="32" y="24" width="586" height="92" rx="29" fill="url(#grain)"/>
      <path d="M18 29H632M18 111H632" stroke="#c8b89d" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>
  <g transform="translate(935 82)">
    <circle cx="74" cy="74" r="74" fill="#2f6b57" opacity="0.94"/>
    <path d="M47 74l18 18 37-45" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
