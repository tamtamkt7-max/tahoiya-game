<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">NI-FS70C 2WAY使い分けイメージ</title><desc id="desc">普段はスチーム、必要なところだけプレスと使い分ける図</desc><rect width="1200" height="675" fill="#ffffff"/><rect x="50" y="50" width="1100" height="575" rx="42" fill="#f6f8f6"/><text x="90" y="135" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="50" font-weight="700" fill="#19231f">普段はスチーム、必要なところだけプレス</text><text x="90" y="190" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="30" fill="#47534e">2WAYで使い分け</text><rect x="90" y="245" width="470" height="315" rx="32" fill="#eaf3ef"/><text x="130" y="305" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="36" font-weight="700" fill="#1f4a3b">ハンガースチーム</text><text x="130" y="380" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="31" fill="#334f45">広い面のシワを</text><text x="130" y="427" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="31" fill="#334f45">手早く整える</text><path d="M430 435c-42-35-45-82-9-116M462 447c-47-43-50-96-10-135M496 459c-54-50-58-111-12-156" fill="none" stroke="#6f9b8a" stroke-width="8" stroke-linecap="round"/><rect x="640" y="245" width="470" height="315" rx="32" fill="#f3efe8"/><text x="685" y="305" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="36" font-weight="700" fill="#5b4529">プレス</text><text x="685" y="380" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="31" fill="#594c3d">襟・袖など</text><text x="685" y="427" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="31" fill="#594c3d">線を出したい部分に</text><path d="M925 475h120l-22-110c-5-23-26-40-50-40h-48z" fill="#4f5557"/><rect x="937" y="295" width="84" height="48" rx="18" fill="#6b7275"/><path d="M900 485h175" stroke="#a18d70" stroke-width="9" stroke-