name: Pseudo Codex Node Profile

on:
  push:
    branches:
      - pseudo-codex-lab-20260820

permissions:
  contents: read
  statuses: write

jobs:
  node-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'

      - name: Validate and publish compact status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$({
            node pseudo_codex_framework/scripts/validate-state.mjs pseudo_codex_framework/PROJECT_STATE.json &&
            node --test pseudo_codex_framework/test/*.test.mjs &&
            npm install --prefix pseudo_codex_framework/fixtures/node-typescript --no-audit --no-fund --ignore-scripts &&
            node pseudo_codex_framework/scripts/run-node-ci.mjs \
              pseudo_codex_framework/fixtures/node-typescript \
              pseudo_codex_framework/PROJECT_STATE.json
          } 2>&1)
          code=$?

          if [ "$code" -eq 0 ]; then
            state=success
            description="state + safety + test + typecheck + lint + build passed"
          else
            state=failure
            description=$(printf '%s\n' "$output" | grep -E 'CHECK_FAILED|MISSING_REQUIRED_SCRIPT|unknown state key|Error:|error TS|LINT_FAIL|not ok|FAIL' | tail -n 1 | cut -c1-120)
            if [ -z "$description" ]; then description="pseudo-Codex Node profile failed"; fi
          fi

          payload=$(jq -n \
            --arg state "$state" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "$description" \
            '{state:$state,target_url:$target_url,description:$description,context:"pseudo-codex/node-ci"}')

          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

          printf '%s\n' "$output"
          exit "$code"
