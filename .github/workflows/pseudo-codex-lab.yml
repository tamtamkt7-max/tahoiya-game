name: Pseudo Codex Lab

on:
  push:
    branches:
      - pseudo-codex-lab-20260820

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run test and publish compact commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$(python -m unittest pseudo_codex_lab.test_calculator -v 2>&1)
          code=$?
          if [ "$code" -eq 0 ]; then
            state=success
            description="pseudo-Codex lab tests passed"
          else
            state=failure
            description=$(printf '%s\n' "$output" | grep -E 'AssertionError:|FAILED|ERROR' | head -n 1 | cut -c1-120)
            if [ -z "$description" ]; then description="pseudo-Codex lab tests failed"; fi
          fi

          payload=$(jq -n \
            --arg state "$state" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "$description" \
            '{state:$state,target_url:$target_url,description:$description,context:"pseudo-codex/ci"}')

          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

          printf '%s\n' "$output"
          exit "$code"
